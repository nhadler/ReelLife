# Tool versions come from uv.lock: the hooks run the project's own tools.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(fixtures|private)/
      - id: end-of-file-fixer
        exclude: ^(fixtures|private)/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        types: [javascript]
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        types_or: [javascript, css, yaml, json]
      - id: makemigrations
        name: makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        files: (models\.py|migrations/)
