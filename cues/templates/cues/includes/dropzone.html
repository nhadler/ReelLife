{# A file field as a drop zone: drag a file onto it, or click to choose. Pass field, and optionally prompt. #}
<div class="field field--wide">
  <label class="dropzone" for="{{ field.id_for_label }}" data-dropzone>
    <svg class="dropzone__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l4.5-4.5 3 3L15 11l5 5M4 5h16v14H4zM15.5 8.5h.01" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="dropzone__text"><strong>{{ prompt|default:"Drop a file here" }}</strong> or click to choose one</span>
    {% if field.help_text %}<span class="dropzone__hint">{{ field.help_text }}</span>{% endif %}
    <span class="dropzone__name" aria-live="polite"></span>
    {{ field }}
  </label>
  {{ field.errors }}
</div>
