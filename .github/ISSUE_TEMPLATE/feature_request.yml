name: Feature request
description: Suggest something ReelTime should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work. Sketches and examples welcome.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you manage today
      description: A spreadsheet, another app, a workaround?
