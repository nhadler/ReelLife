# Static analysis for security bugs in the Python and JavaScript, on
# every pull request and weekly against main.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Vendored, minified third-party files aren't ours to analyse.
          config: |
            paths-ignore:
              - cues/static/cues/vendor
              - staticfiles
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
