# Static analysis for security bugs in the Python and JavaScript, on
# every pull request and weekly against main.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning is free on public repositories but needs GitHub Code
    # Security on private ones, so this runs once the repository
    # variable CODE_SCANNING is set to true (Settings, Secrets and
    # variables, Actions, Variables).
    if: vars.CODE_SCANNING == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Vendored, minified third-party files aren't ours to analyse.
          config: |
            paths-ignore:
              - cues/static/cues/vendor
              - staticfiles
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
